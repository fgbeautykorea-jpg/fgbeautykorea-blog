# Decap CMS 설정 — /admin
# 저장하면 GitHub 저장소에 커밋되고, Netlify가 1~2분 안에 다시 빌드합니다.
# 배포 전: backend.repo 를 실제 GitHub 저장소(계정/저장소이름)로, site_url 을 실제 도메인으로 바꾸세요.

backend:
  name: github
  repo: FGBEAUTYKOREA-jpg/fgbeautykorea-blog
  branch: main
  commit_messages:
    create: "관리자: '{{slug}}' 추가"
    update: "관리자: '{{slug}}' 수정"
    delete: "관리자: '{{slug}}' 삭제"
    uploadMedia: "관리자: 이미지 '{{path}}' 업로드"
    deleteMedia: "관리자: 이미지 '{{path}}' 삭제"

# 이 컴퓨터에서 `npx decap-server`로 테스트할 때만 쓰임 (실제 사이트에서는 무시)
local_backend: true

locale: ko
site_url: https://blog.fgbeautykorea.co.kr
display_url: https://blog.fgbeautykorea.co.kr
logo_url: /assets/logo.png

media_folder: src/assets/uploads
public_folder: /assets/uploads

collections:
  # ═════════════════════════ 글
  # 오른쪽 미리보기 맨 위에 'SEO · AEO · GEO 점검표'가 실시간으로 떠요 (src/admin/seo-preview.js).
  - name: posts
    label: "글"
    label_singular: "글"
    description: "새 글을 쓰고 저장하면 1~2분 뒤 블로그에 올라갑니다. 오른쪽 미리보기의 'SEO 점검표'가 초록색이 되도록 채워 주세요. 사이트 전체 점검 결과는 왼쪽 아래 'SEO 리포트' 버튼에서 볼 수 있어요."
    folder: src/posts
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: "{{fields.slug}}"
    identifier_field: title
    summary: "{{title}} · {{date}}"
    sortable_fields: ["date", "title"]
    preview_path: "blog/{{fields.category}}/{{slug}}/"
    fields:
      - { label: "제목 (H1)", name: title, widget: string, hint: "글 맨 위 큰 제목. 메인 키워드를 앞쪽에 넣어 주세요." }
      - { label: "연구일지 번호", name: lab_no, widget: number, value_type: int, min: 1, required: false, hint: "LAB NOTE 001 의 숫자. 비우면 발행 순서대로 자동으로 붙어요" }
      - { label: "메인 키워드", name: keyword, widget: string, required: false, hint: "이 글로 검색되고 싶은 말 하나. 예) robots.txt AI 크롤러 — 제목·설명·첫 문단에 들어갔는지 점검표가 확인해요" }
      - label: "주소 (영문)"
        name: slug
        widget: string
        hint: "영문 소문자·숫자·하이픈(-)만, 짧고 뜻이 통하게. 예) llms-txt-guide → /blog/카테고리/llms-txt-guide/ · 저장 후에는 바꾸지 마세요 (꼭 바꿔야 하면 '사이트 설정 › 주소 이동'에 옛 주소 등록)"
        pattern: ["^[a-z0-9]+(-[a-z0-9]+)*$", "영문 소문자, 숫자, 하이픈(-)만 쓸 수 있어요"]
      - { label: "카테고리", name: category, widget: relation, collection: settings, file: categories, search_fields: ["items.*.name"], display_fields: ["items.*.name"], value_field: "items.*.id", hint: "주소에 들어가요. 카테고리 추가는 '설정 › 카테고리'" }
      - { label: "작성자", name: author, widget: relation, collection: settings, file: authors, search_fields: ["items.*.name"], display_fields: ["items.*.name"], value_field: "items.*.id", hint: "실제 작성자 — 검색엔진이 신뢰도(E-E-A-T)를 판단하는 근거예요. 작성자 추가는 '설정 › 작성자'" }
      - { label: "발행일", name: date, widget: datetime, default: "{{now}}", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, picker_utc: true }
      - { label: "수정일", name: updated, widget: datetime, required: false, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, picker_utc: true, hint: "내용을 고쳤을 때만 그날 날짜로. 글에 '수정 ○월 ○일'로 표시되고 검색엔진에도 알려요" }
      - { label: "태그", name: tags, widget: list, required: false, field: { label: "태그", name: tag, widget: string }, hint: "# 없이. 같은 태그 글끼리 '함께 읽으면 좋은 글'로 이어져요. 태그 모음 페이지는 자동으로 검색 제외(noindex)" }
      - { label: "검색 결과 제목 (50~60자)", name: seo_title, widget: string, required: false, hint: "구글·네이버 검색 결과에 파란 글씨로 뜨는 제목. 비우면 '제목 | 블로그 이름'. 메인 키워드를 맨 앞에." }
      - { label: "검색 결과 설명 (120~150자)", name: description, widget: text, required: false, hint: "검색 결과 제목 아래 회색 설명. 클릭하고 싶게, 메인 키워드를 넣어서. 비우면 목록 요약을 사용해요." }
      - { label: "목록 요약", name: excerpt, widget: text, required: false, hint: "글 목록 카드에 두 줄로 보이는 소개 문장" }
      - label: "핵심 요약 (글 맨 위)"
        name: summary
        widget: markdown
        required: false
        minimal: true
        buttons: [bold, link]
        editor_components: []
        hint: "제목 아래 파란 박스. 이 글의 결론을 3~4문장으로 — AI가 가장 먼저 인용하는 부분이에요."
      - label: "본문"
        name: body
        widget: markdown
        pattern: ['^(?![\s\S]*!\[\s*\]\()(?![\s\S]*(?:^|\n)#\s)[\s\S]*$', "사진 설명(대체 텍스트)이 비었거나 H1(# 제목)이 있어요. 사진을 눌러 대체 텍스트를 채우고, 소제목은 H2(##)부터 쓰세요."]
        hint: "자주 묻는 질문은 툴바 + → '자주 묻는 질문'으로 넣으세요. ① 소제목(H2)은 질문형으로 — 예) llms.txt는 어떤 역할을 합니까? ② 소제목 바로 아래 첫 문단에 40~60단어로 답부터 ③ 자주 묻는 질문은 H3 '질문?' + 답 → FAQ 자동 ④ '~하는 방법/순서' 소제목 아래 번호 목록 → HowTo 자동 ⑤ 표·리스트·인용(>) 박스 적극 활용 ⑥ 사진은 + 버튼 → 이미지, 대체 텍스트 필수"
      - label: "관련 글 직접 연결"
        name: related
        widget: relation
        collection: posts
        search_fields: ["title"]
        display_fields: ["title"]
        value_field: "{{slug}}"
        multiple: true
        required: false
        hint: "비워도 같은 카테고리·태그 글이 자동으로 붙어요. 꼭 이어 읽혀야 할 글이 있으면 골라 주세요."
      - label: "검색 노출"
        name: robots
        widget: select
        required: false
        default: ""
        options:
          - { label: "자동 (본문이 짧으면 검색 제외)", value: "" }
          - { label: "검색 허용 (index, follow)", value: "index, follow" }
          - { label: "검색 제외, 링크는 따라감 (noindex, follow)", value: "noindex, follow" }
          - { label: "검색 제외, 링크도 무시 (noindex, nofollow)", value: "noindex, nofollow" }
        hint: "보통 '자동'. 본문이 기준 글자 수('사이트 설정')보다 짧으면 얇은 콘텐츠로 보고 검색에서 뺍니다."
      # 썸네일: 아래 글씨만 채우면 'LAB NOTE' 썸네일이 자동으로 그려져요 (lib/thumbs.js). 오른쪽 미리보기에 바로 보여요.
      - { label: "썸네일 영문 (선택)", name: thumb_en, widget: string, required: false, hint: "얇은 영문 한 줄. 예) Niacinamide × Cheonnyeoncho — 25자 안쪽이 예뻐요" }
      - { label: "썸네일 한글 큰 제목", name: thumb_ko, widget: string, required: false, hint: "굵은 한글. 예) 나이아신아마이드 × 천년초 — 15자 안쪽 권장. 비우면 메인 키워드가 들어가요" }
      - { label: "썸네일 한 줄 설명 (선택)", name: thumb_sub, widget: string, required: false, hint: "회색 작은 글씨. 예) 강화와 회복, 두 성분의 역할 나누기" }
      - { label: "직접 만든 썸네일 이미지 (선택)", name: thumb_image, widget: image, required: false, hint: "올리면 자동 썸네일 대신 이 이미지를 써요 (가로형 1200×630). 보통은 비워 두세요" }
      - { label: "직접 만든 썸네일 설명 (alt)", name: thumb_alt, widget: string, required: false, hint: "직접 이미지를 올렸다면 필수. 이미지에 무엇이 보이는지 한 문장으로" }

  # ═════════════════════════ 페이지 (소개, 개인정보처리방침 등)
  - name: pages
    label: "페이지"
    label_singular: "페이지"
    description: "소개·개인정보처리방침 같은 고정 페이지입니다. 주소는 /영문주소/ 로 만들어져요."
    folder: src/pages
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: "{{fields.slug}}"
    identifier_field: heading
    summary: "{{heading}} → /{{slug}}/"
    fields:
      - { label: "화면 제목 (H1)", name: heading, widget: string }
      - label: "주소 (영문)"
        name: slug
        widget: string
        hint: "예) privacy → /privacy/ · 저장 후에는 바꾸지 마세요"
        pattern: ["^[a-z0-9]+(-[a-z0-9]+)*$", "영문 소문자, 숫자, 하이픈(-)만 쓸 수 있어요"]
      - { label: "검색 결과 제목 (50~60자)", name: title, widget: string }
      - { label: "검색 결과 설명 (120~150자)", name: description, widget: text }
      - label: "페이지 종류"
        name: pageKind
        widget: select
        required: false
        default: "page"
        options:
          - { label: "일반 페이지", value: "page" }
          - { label: "블로그 소개 (운영 정보·작성자 목록 자동 표시)", value: "about" }
      - { label: "검색 노출", name: robots, widget: select, required: false, default: "", options: [{ label: "검색 허용", value: "" }, { label: "검색 제외 (noindex, follow)", value: "noindex, follow" }] }
      - { label: "본문", name: body, widget: markdown }

  # ═════════════════════════ 설정
  - name: settings
    label: "설정"
    description: "블로그 이름·주소·운영 주체·검색엔진/AI 설정, 카테고리, 작성자를 관리합니다."
    editor: { preview: false }
    files:
      - name: site
        label: "사이트 설정"
        file: src/_data/site.json
        fields:
          - { label: "블로그 이름", name: name, widget: string }
          - { label: "한 줄 소개", name: tagline, widget: string, hint: "홈 맨 위 큰 제목 아래 문장" }
          - { label: "홈 검색 결과 제목 (50~60자)", name: home_title, widget: string, hint: "블로그 이름 + 핵심 주제 키워드" }
          - { label: "홈 검색 결과 설명 (120~150자)", name: description, widget: text, hint: "llms.txt 첫 줄과 RSS 설명으로도 쓰여요" }
          - { label: "블로그 주소", name: url, widget: string, hint: "https://로 시작, 끝에 / 없이. canonical·사이트맵·공유 주소에 쓰여요" }
          - { label: "로고 (정사각형)", name: logo, widget: image }
          - { label: "브라우저 탭 아이콘", name: favicon, widget: image }
          - label: "운영 주체 (회사 정보)"
            name: publisher
            widget: object
            hint: "구조화 데이터(Organization)·하단·llms.txt·소개 페이지에 똑같이 쓰여요. 사업자등록증과 토씨 하나까지 같게 — AI가 한 회사로 인식하는 핵심 조건"
            fields:
              - { label: "회사 이름", name: name, widget: string, hint: "예) 에프지뷰티코리아" }
              - { label: "법인명", name: legal_name, widget: string, required: false, hint: "사업자등록증 그대로. 예) 주식회사 에프지뷰티코리아" }
              - { label: "다른 이름 (영문명·계정명)", name: alternate_names, widget: list, required: false, field: { label: "이름", name: name, widget: string }, hint: "예) fgbeautykorea, FG BEAUTY KOREA — 같은 회사로 인식되도록" }
              - { label: "대표자", name: ceo, widget: string, required: false }
              - { label: "설립일", name: founded, widget: string, required: false, hint: "예) 2023-05-01" }
              - { label: "주소", name: address, widget: string, required: false }
              - { label: "이메일", name: email, widget: string, required: false }
              - { label: "사업자등록번호", name: bizno, widget: string, required: false }
              - { label: "회사 홈페이지", name: homepage, widget: string, required: false, hint: "https://… (블로그와 다른 주소라면)" }
              - { label: "공식 채널 링크", name: same_as, widget: list, required: false, field: { label: "주소", name: url, widget: string }, hint: "네이버 블로그·인스타그램·유튜브·링크드인 등 https:// 주소 — 같은 회사임을 연결해요" }
          - label: "검색엔진 · AI"
            name: seo
            widget: object
            fields:
              - { label: "검색 제목 뒤에 붙는 말", name: title_suffix, widget: string, required: false, hint: "보통 비워 둡니다 — 구글·네이버가 사이트 이름을 따로 보여줘요. 넣을 때는 앞에 띄어쓰기 포함. 예) ' | 브랜드'" }
              - { label: "기본 공유 이미지 (1200×630)", name: og_image, widget: image, hint: "대표 이미지가 없는 페이지를 카카오톡·SNS에 공유할 때 보여요" }
              - { label: "네이버 서치어드바이저 인증 코드", name: naver_verification, widget: string, required: false, hint: "서치어드바이저 › 사이트 등록 › HTML 태그 방식에서 content=\"…\" 안의 값만 붙여넣기" }
              - { label: "구글 서치콘솔 인증 코드", name: google_verification, widget: string, required: false, hint: "HTML 태그 방식일 때만. content=\"…\" 안의 값" }
              - { label: "얇은 콘텐츠 기준 (본문 글자 수)", name: thin_min_chars, widget: number, value_type: int, min: 0, max: 5000, hint: "이보다 짧은 글은 '자동'일 때 검색에서 빠져요. 기본 800" }
              - { label: "AI 소개 문구 (llms.txt)", name: llms_intro, widget: text, hint: "ChatGPT·Claude·Perplexity 같은 AI가 이 블로그를 이해하도록 읽는 소개. 사실만 2~3문장" }
              - label: "주소 이동 (301 리다이렉트)"
                name: redirects
                widget: list
                required: false
                summary: "{{fields.from}} → {{fields.to}}"
                hint: "옛 주소로 들어온 사람과 검색엔진을 새 주소로 보내요. 글 주소를 바꿨거나 글을 지웠을 때 등록"
                fields:
                  - { label: "옛 주소", name: from, widget: string, hint: "예) /blog/geo/old-post/" }
                  - { label: "새 주소", name: to, widget: string, hint: "예) /blog/geo/new-post/" }
          - label: "상단 메뉴 (카테고리 뒤에 붙음)"
            name: nav
            widget: list
            summary: "{{fields.label}} → {{fields.link}}"
            fields:
              - { label: "이름", name: label, widget: string }
              - { label: "주소", name: link, widget: string }
          - label: "글 하단 안내 박스"
            name: cta
            widget: object
            fields:
              - { label: "제목 (비우면 숨김)", name: title, widget: string, required: false }
              - { label: "설명", name: desc, widget: text, required: false }
              - { label: "버튼 문구", name: label, widget: string, required: false }
              - { label: "버튼 주소", name: link, widget: string, required: false }
          - { label: "하단 안내 문구", name: footer_note, widget: text, required: false }
      - name: categories
        label: "카테고리"
        file: src/_data/categories.json
        fields:
          - label: "카테고리 목록"
            name: items
            widget: list
            summary: "{{fields.name}} → /blog/{{fields.id}}/"
            fields:
              - { label: "이름", name: name, widget: string }
              - label: "주소 (영문)"
                name: id
                widget: string
                hint: "예) technical-seo → /blog/technical-seo/ · 글이 생긴 뒤에는 바꾸지 마세요"
                pattern: ["^[a-z0-9]+(-[a-z0-9]+)*$", "영문 소문자, 숫자, 하이픈(-)만 쓸 수 있어요"]
              - { label: "설명 (120~150자)", name: desc, widget: text, hint: "카테고리 페이지 소개이자 검색 결과 설명" }
              - { label: "검색 결과 제목 (비우면 자동)", name: seo_title, widget: string, required: false, hint: "뒤에 ' | 블로그 이름'이 자동으로 붙어요" }
              - { label: "필러 글 (대표 가이드) 주소", name: pillar, widget: relation, collection: posts, search_fields: ["title"], display_fields: ["title"], value_field: "{{slug}}", required: false, hint: "이 주제를 가장 넓게 다룬 글. 카테고리 맨 위에 크게 걸리고, 같은 카테고리 글마다 '전체 가이드' 링크가 붙어요" }
      - name: authors
        label: "작성자"
        file: src/_data/authors.json
        fields:
          - label: "작성자 목록"
            name: items
            widget: list
            summary: "{{fields.name}} · {{fields.role}}"
            fields:
              - { label: "이름", name: name, widget: string }
              - label: "주소 (영문)"
                name: id
                widget: string
                hint: "예) hong-gildong → /author/hong-gildong/ · 글이 생긴 뒤에는 바꾸지 마세요"
                pattern: ["^[a-z0-9]+(-[a-z0-9]+)*$", "영문 소문자, 숫자, 하이픈(-)만 쓸 수 있어요"]
              - { label: "직함", name: role, widget: string }
              - { label: "소개", name: bio, widget: text, hint: "경력·전문 분야를 사실대로 2~3문장" }
              - { label: "사진", name: photo, widget: image, required: false }
              - { label: "외부 프로필 링크", name: same_as, widget: list, required: false, field: { label: "주소", name: url, widget: string }, hint: "링크드인·브런치·인터뷰 기사 등 https:// 주소" }
